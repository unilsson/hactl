[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hactl"
version = "0.1.0"
description = "A command-line and terminal interface for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "typer>=0.12",
    "textual>=1.0",
]

[project.scripts]
hactl = "hactl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]